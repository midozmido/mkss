name: Publish articles to WordPress

on:
  push:
    branches: [main]
    paths: ['wp-publisher/content/**.md']
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 9 صباحًا بتوقيت سيدني
  workflow_dispatch:
    inputs:
      status:
        description: حالة النشر
        type: choice
        default: draft
        options: [draft, publish]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: wp-publisher/requirements.txt

      - run: pip install -r wp-publisher/requirements.txt

      - name: Verify connection
        working-directory: wp-publisher
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python wp_publish.py doctor

      - name: Publish
        working-directory: wp-publisher
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python wp_publish.py publish --all --status "${{ inputs.status || 'draft' }}" -v
